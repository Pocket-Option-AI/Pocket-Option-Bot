<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket option Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            overflow: hidden;
        }

        .app-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            cursor: pointer;
            background: transparent;
        }

        /* Main Trading Buttons */
        .btn-buy-area { bottom: 6%; left: 5%; width: 44%; height: 6%; }
        .btn-sell-area { bottom: 6%; right: 5%; width: 44%; height: 6%; }

        /* 
           Bottom Nav Areas 
           We keep Trades and Signals exactly where they are in the image.
        */
        .trades-area { bottom: 0%; left: 0%; width: 18%; height: 7%; }
        .signals-area { bottom: 0%; left: 38%; width: 18%; height: 7%; }
        .classic-area { bottom: 0%; left: 56%; width: 18%; height: 7%; }
        .social-area { bottom: 0%; left: 75%; width: 15%; height: 7%; }
        .more-area { bottom: 0%; left: 90%; width: 10%; height: 7%; }

        /* --- THE THIN BOT BUTTON --- */
        .visible-bot-btn {
            position: absolute;
            bottom: 0%;
            left: 19%; /* Placed right after Trades */
            width: 18%; /* Squeezed before Signals */
            height: 7%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8892b0; 
            font-size: 10px;
            text-decoration: none;
            z-index: 20;
            background-color: #0b132b; /* Hides the background image exactly underneath it */
        }
        
        .visible-bot-btn span { margin-top: 2px; }
        .visible-bot-btn:active { color: #00c853; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <img src="background.jpg" alt="Pocket Option App" class="app-image">

        <!-- Existing Clickable Areas (NOT COVERED) -->
        <a href="#" class="click-area btn-buy-area" onclick="alert('Pocket option Bot: BUY clicked.')"></a>
        <a href="#" class="click-area btn-sell-area" onclick="alert('Pocket option Bot: SELL clicked.')"></a>
        
        <a href="#" class="click-area trades-area" onclick="alert('Pocket option Bot: Trades opened.')"></a>
        <a href="#" class="click-area signals-area" onclick="alert('Pocket option Bot: Signals opened.')"></a>
        <a href="#" class="click-area classic-area" onclick="alert('Pocket option Bot: Classic mode opened.')"></a>
        <a href="#" class="click-area social-area" onclick="alert('Pocket option Bot: Social Trading opened.')"></a>
        <a href="#" class="click-area more-area" onclick="alert('Pocket option Bot: More opened.')"></a>

        <!-- YOUR THIN BOT BUTTON -->
        <a href="#" class="visible-bot-btn" onclick="alert('Pocket option Bot: Bot opened.')">
            <!-- Rings Icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
                <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
                <circle cx="12" cy="12" r="1"></circle>
            </svg>
            <span>Bot</span>
        </a>

    </div>

</body>
</html>
