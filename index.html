<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket option Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            overflow: hidden;
        }

        .app-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            cursor: pointer;
            background: transparent;
        }

        /* BUY Button */
        .btn-buy-area {
            bottom: 6%;
            left: 5%;
            width: 44%;
            height: 6%;
        }

        /* SELL Button */
        .btn-sell-area {
            bottom: 6%;
            right: 5%;
            width: 44%;
            height: 6%;
        }

        /* Bottom Nav: Trades (1st slot) */
        .trades-area {
            bottom: 0%;
            left: 0%;
            width: 20%;
            height: 7%;
        }

        /* Bottom Nav: Bot Button (2nd slot - NEW) */
        .bot-btn-area {
            bottom: 0%;
            left: 20%;
            width: 20%;
            height: 7%;
        }

        /* Bottom Nav: Signals (3rd slot) */
        .signals-area {
            bottom: 0%;
            left: 40%;
            width: 20%;
            height: 7%;
        }

        /* Bottom Nav: Classic Mode (4th slot) */
        .classic-area {
            bottom: 0%;
            left: 60%;
            width: 20%;
            height: 7%;
        }
        
        /* Bottom Nav: Social Trading (5th slot) */
        .social-area {
            bottom: 0%;
            left: 80%;
            width: 20%;
            height: 7%;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Loads your background.jpg image -->
        <img src="background.jpg" alt="Pocket Option App" class="app-image">

        <!-- Clickable Areas -->
        <a href="#" class="click-area btn-buy-area" onclick="alert('Pocket option Bot: BUY clicked.')"></a>
        
        <a href="#" class="click-area btn-sell-area" onclick="alert('Pocket option Bot: SELL clicked.')"></a>

        <!-- Bottom Navigation Click Areas -->
        <a href="#" class="click-area trades-area" onclick="alert('Pocket option Bot: Trades opened.')"></a>

        <!-- YOUR NEW BOT BUTTON -->
        <a href="#" class="click-area bot-btn-area" onclick="alert('Pocket option Bot: Bot Settings opened.')"></a>

        <a href="#" class="click-area signals-area" onclick="alert('Pocket option Bot: Signals opened.')"></a>

        <a href="#" class="click-area classic-area" onclick="alert('Pocket option Bot: Classic mode opened.')"></a>
        
        <a href="#" class="click-area social-area" onclick="alert('Pocket option Bot: Social Trading opened.')"></a>

    </div>

</body>
</html>
