<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket option Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            overflow: hidden;
        }

        .app-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            cursor: pointer;
            background: transparent;
        }

        /* BUY Button */
        .btn-buy-area {
            bottom: 6%;
            left: 5%;
            width: 44%;
            height: 6%;
        }

        /* SELL Button */
        .btn-sell-area {
            bottom: 6%;
            right: 5%;
            width: 44%;
            height: 6%;
        }

        /* Bottom Nav: Trades (1st slot) */
        .trades-area {
            bottom: 0%;
            left: 0%;
            width: 20%;
            height: 7%;
        }

        /* Bottom Nav: Signals (3rd slot) */
        .signals-area {
            bottom: 0%;
            left: 40%;
            width: 20%;
            height: 7%;
        }

        /* Bottom Nav: Classic Mode (4th slot) */
        .classic-area {
            bottom: 0%;
            left: 60%;
            width: 20%;
            height: 7%;
        }
        
        /* Bottom Nav: Social Trading (5th slot) */
        .social-area {
            bottom: 0%;
            left: 80%;
            width: 20%;
            height: 7%;
        }

        /* --- VISIBLE BOT BUTTON STYLES --- */
        .visible-bot-btn {
            position: absolute;
            bottom: 0%;
            left: 20%; /* 2nd slot */
            width: 20%;
            height: 7%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8892b0; /* Gray color like the others */
            font-size: 11px;
            text-decoration: none;
            z-index: 20;
        }

        .visible-bot-btn span {
            margin-top: 2px;
        }

        .visible-bot-btn:hover, .visible-bot-btn:active {
            color: #00c853; /* Turns green when clicked */
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Loads your background.jpg image -->
        <img src="background.jpg" alt="Pocket Option App" class="app-image">

        <!-- Invisible Clickable Areas -->
        <a href="#" class="click-area btn-buy-area" onclick="alert('Pocket option Bot: BUY clicked.')"></a>
        <a href="#" class="click-area btn-sell-area" onclick="alert('Pocket option Bot: SELL clicked.')"></a>
        <a href="#" class="click-area trades-area" onclick="alert('Pocket option Bot: Trades opened.')"></a>
        <a href="#" class="click-area signals-area" onclick="alert('Pocket option Bot: Signals opened.')"></a>
        <a href="#" class="click-area classic-area" onclick="alert('Pocket option Bot: Classic mode opened.')"></a>
        <a href="#" class="click-area social-area" onclick="alert('Pocket option Bot: Social Trading opened.')"></a>

        <!-- YOUR VISIBLE BOT BUTTON -->
        <!-- Using a simple robot icon + text -->
        <a href="#" class="visible-bot-btn" onclick="alert('Pocket option Bot: Bot Settings opened.')">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13a2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 0 0-5m9 0a2.5 2.5 0 0 0 0 5 2.5 2.5 0 0 0 0-5Z"/>
            </svg>
            <span>Bot</span>
        </a>

    </div>

</body>
</html>
