<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket option Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b132b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            overflow: hidden;
        }

        .app-image {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .click-area {
            position: absolute;
            display: block;
            cursor: pointer;
            background: transparent;
        }

        /* Main Trading Buttons */
        .btn-buy-area { bottom: 6%; left: 5%; width: 44%; height: 6%; }
        .btn-sell-area { bottom: 6%; right: 5%; width: 44%; height: 6%; }

        /* 
           Bottom Nav Layout (6 slots)
           We divide the 100% width into 6 equal parts (roughly 16.6% each)
        */
        .trades-area { bottom: 0%; left: 0%; width: 16.66%; height: 7%; }
        
        /* THE NEW BOT BUTTON AREA */
        .visible-bot-btn {
            position: absolute;
            bottom: 0%;
            left: 16.66%; /* Exact slot between Trades and Signals */
            width: 16.66%;
            height: 7%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #8892b0; /* Gray like the others */
            font-size: 10px;
            text-decoration: none;
            z-index: 20;
            background-color: #0b132b; /* Solid background to hide the image underneath */
        }
        
        .visible-bot-btn span { margin-top: 2px; }
        .visible-bot-btn:active { color: #00c853; }

        /* Shift the rest of the buttons to fit the 6 slots */
        .signals-area { bottom: 0%; left: 33.33%; width: 16.66%; height: 7%; }
        .classic-area { bottom: 0%; left: 50%; width: 16.66%; height: 7%; }
        .social-area { bottom: 0%; left: 66.66%; width: 16.66%; height: 7%; }
        .more-area { bottom: 0%; left: 83.33%; width: 16.66%; height: 7%; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <img src="background.jpg" alt="Pocket Option App" class="app-image">

        <!-- Clickable Areas for existing buttons -->
        <a href="#" class="click-area btn-buy-area" onclick="alert('Pocket option Bot: BUY clicked.')"></a>
        <a href="#" class="click-area btn-sell-area" onclick="alert('Pocket option Bot: SELL clicked.')"></a>
        
        <a href="#" class="click-area trades-area" onclick="alert('Pocket option Bot: Trades opened.')"></a>
        <a href="#" class="click-area signals-area" onclick="alert('Pocket option Bot: Signals opened.')"></a>
        <a href="#" class="click-area classic-area" onclick="alert('Pocket option Bot: Classic mode opened.')"></a>
        <a href="#" class="click-area social-area" onclick="alert('Pocket option Bot: Social Trading opened.')"></a>
        <a href="#" class="click-area more-area" onclick="alert('Pocket option Bot: More opened.')"></a>

        <!-- YOUR VISIBLE BOT BUTTON (Between Trades and Signals) -->
        <a href="#" class="visible-bot-btn" onclick="alert('Pocket option Bot: Bot opened.')">
            <!-- The "Rings" icon like Signals -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"></path>
                <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
                <circle cx="12" cy="12" r="1"></circle>
            </svg>
            <span>Bot</span>
        </a>

    </div>

</body>
</html>
