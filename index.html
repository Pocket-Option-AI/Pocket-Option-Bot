<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket option Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- This container holds the exact image and the invisible buttons -->
    <div class="app-container">
        
        <!-- The image of your screenshot -->
        <img src="background.png" alt="Pocket Option App" class="app-image">

        <!-- The invisible clickable areas -->
        <!-- BUY Button -->
        <a href="#" class="click-area btn-buy-area" onclick="alert('Pocket option Bot: BUY clicked.')"></a>
        
        <!-- SELL Button -->
        <a href="#" class="click-area btn-sell-area" onclick="alert('Pocket option Bot: SELL clicked.')"></a>

        <!-- Botsubscription Tab -->
        <a href="#" class="click-area botsub-area" onclick="alert('Pocket option Bot: Botsubscription opened.')"></a>

        <!-- Trades Tab -->
        <a href="#" class="click-area trades-area" onclick="alert('Pocket option Bot: Trades opened.')"></a>

    </div>

</body>
</html>
